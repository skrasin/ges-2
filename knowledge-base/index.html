<title>ГЭС-2 — база знаний посетительской службы</title>
<!--
  Автономный файл: данные, стили и логика встроены целиком, внешних
  запросов и зависимостей нет — можно открывать локально двойным кликом,
  с флешки, из внутренней папки, без сервера и интернета.

  ЭТО СГЕНЕРИРОВАННЫЙ ФАЙЛ. Не редактируйте его напрямую — правки потеряются
  при следующей сборке. Источник:
    docs/files/ges2_kb_data.json  — данные (вопрос/ответ/категория/статус)
    knowledge-base/template.html  — этот шаблон (разметка/стили/логика)
    knowledge-base/build_kb.py    — сборщик, который валидирует данные и
                                     подставляет их в шаблон

  Обновить базу: отредактируйте ges2_kb_data.json, затем
    python3 knowledge-base/build_kb.py
  Сборщик остановится с понятной ошибкой, если нарушено правило целостности
  (answered ⇒ answer и source заполнены; pending ⇒ answer пустой).
-->
<style>
  :root {
    --font-text: "Diagramatika Text", "Diagramatika Text Fallback", "Helvetica Neue", Arial, sans-serif;
    --font-display: "Diagramatika Display", "Diagramatika Display Fallback", "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    --tracking-display: 0.02em;

    /* Фиксированная (не fluid-vw) шкала — сознательное отличие от токенов
       публичного сайта: это плотный рабочий инструмент для поиска на лету,
       а не витринная страница, ему нужнее стабильный размер текста, чем
       адаптивный масштаб под ширину окна. Цвет/шрифт/hairline/radius —
       те же, что в design-system/tokens.css. */
    --text-sm: 13px;
    --text-base: 16px;
    --text-lg: 18px;
    --display-md: 22px;
    --display-lg: 34px;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-6: 24px;
    --space-8: 32px;

    --color-ink: #000000;
    --color-paper: #FFFFFF;
    --color-muted: #767267;
    --color-hint: #9C9A91;
    --color-hairline-bg: #F1EFE9;
    --color-pending-bg: #FBF8F1;
    --color-error: #B23A00;

    --border-hairline: 0.5px solid var(--color-ink);
    --radius: 0px;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; background:var(--color-paper); color:var(--color-ink);
    font-family:var(--font-text); font-size:var(--text-base); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:840px; margin:0 auto; padding: 0 var(--space-4) var(--space-8);}

  header.masthead{
    padding: var(--space-6) 0 var(--space-4);
    border-bottom: var(--border-hairline);
    margin-bottom: var(--space-4);
  }
  .eyebrow{
    font-family:var(--font-text); font-size:var(--text-sm); text-transform:uppercase;
    letter-spacing:0.06em; color:var(--color-muted);
  }
  h1{
    font-family:var(--font-display); font-weight:400; letter-spacing:var(--tracking-display);
    font-size:var(--display-lg); margin: var(--space-1) 0 0;
  }
  .dek{color:var(--color-ink); margin: var(--space-2) 0 0; max-width:60ch;}
  .stats{
    font-family:var(--font-mono); font-size:11px; color:var(--color-muted);
    margin-top: var(--space-3); display:flex; gap: var(--space-4); flex-wrap:wrap;
  }

  /* ---- поиск ---- */
  .search-bar{
    position:sticky; top:0; background:var(--color-paper); z-index:5;
    padding: var(--space-3) 0; border-bottom: var(--border-hairline);
    display:flex; flex-direction:column; gap: var(--space-2);
  }
  #search{
    width:100%; font-family:var(--font-text); font-size:var(--text-lg); color:var(--color-ink);
    border: var(--border-hairline); border-radius:var(--radius); background:var(--color-paper);
    padding: var(--space-3) var(--space-4);
  }
  #search::placeholder{color:var(--color-hint);}
  #search:focus-visible{outline:2px solid var(--color-ink); outline-offset:2px;}
  .result-count{font-family:var(--font-mono); font-size:11px; color:var(--color-muted);}

  /* ---- категории ---- */
  .cat-scroller{
    display:flex; gap: var(--space-2); overflow-x:auto; padding: var(--space-3) 0;
    -webkit-overflow-scrolling:touch;
  }
  .cat-scroller::-webkit-scrollbar{height:4px;}
  .chip{
    font-family:var(--font-text); font-size:var(--text-sm); color:var(--color-ink);
    background:var(--color-paper); border: var(--border-hairline); border-radius:var(--radius);
    padding: var(--space-1) var(--space-3); white-space:nowrap; cursor:pointer; flex:none;
  }
  .chip.active{background:var(--color-ink); color:var(--color-paper);}
  .chip .n{color:var(--color-muted); margin-left:4px;}
  .chip.active .n{color:#CFCBBE;}

  /* ---- список результатов ---- */
  #results{margin-top: var(--space-2);}
  .entry{
    border: var(--border-hairline); border-radius:var(--radius);
    padding: var(--space-4); margin-bottom: var(--space-3);
  }
  .entry[data-status="pending"]{
    background: var(--color-pending-bg); border-style:dashed;
  }
  .entry-head{
    display:flex; justify-content:space-between; align-items:baseline;
    gap: var(--space-2); margin-bottom: var(--space-2);
  }
  .entry-category{
    font-family:var(--font-text); font-size:var(--text-sm); text-transform:uppercase;
    letter-spacing:0.04em; color:var(--color-muted);
  }
  .entry-id{font-family:var(--font-mono); font-size:11px; color:var(--color-hint);}
  .entry-question{
    font-family:var(--font-display); font-weight:400; letter-spacing:var(--tracking-display);
    font-size:var(--display-md); margin:0 0 var(--space-2); text-wrap:balance;
  }
  .entry-answer{font-size:var(--text-base); white-space:pre-line;}
  .entry-pending-tag{
    display:inline-block; font-family:var(--font-text); font-size:11px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.05em; color:var(--color-error);
    border:1px solid var(--color-error); padding:2px 6px; margin-bottom: var(--space-2);
  }
  .entry-notes{color:var(--color-muted); font-size:var(--text-sm); font-style:italic;}
  .entry-notes::before{content:"Для команды: ";font-style:normal;}
  .entry-footer{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;
    gap: var(--space-2); margin-top: var(--space-3); padding-top: var(--space-2);
    border-top: 0.5px solid var(--color-hairline-bg);
  }
  .entry-source-line{font-family:var(--font-mono); font-size:11px; color:var(--color-muted);}
  .copy-btn{
    font-family:var(--font-text); font-size:12px; color:var(--color-ink);
    background:var(--color-paper); border: var(--border-hairline); border-radius:var(--radius);
    padding: 4px 10px; cursor:pointer;
  }
  .copy-btn:hover{background:var(--color-hairline-bg);}
  .copy-btn.copied{background:var(--color-ink); color:var(--color-paper);}

  mark{background:var(--color-ink); color:var(--color-paper); padding:0 1px;}

  .empty-state{
    text-align:center; padding: var(--space-8) var(--space-4); color:var(--color-muted);
  }
  .empty-state button{
    margin-top: var(--space-3); font-family:var(--font-text); font-size:var(--text-sm);
    background:var(--color-ink); color:var(--color-paper); border:none;
    border-radius:var(--radius); padding: var(--space-2) var(--space-4); cursor:pointer;
  }

  footer.page-footer{
    margin-top: var(--space-8); padding-top: var(--space-4); border-top: var(--border-hairline);
    font-family:var(--font-mono); font-size:11px; color:var(--color-muted);
  }

  @media (max-width:520px){
    .entry-footer{align-items:flex-start;}
  }
</style>
</head>

": "GES2-006", "category": "Режим работы", "question": "Работаете ли вы по праздникам?", "answer": "", "status": "pending", "source": null, "notes": "[уточнить: расписание в праздничные дни отдельно на сайте не заявлено — проверять по факту в календаре на дату]", "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": null}, {"id": "GES2-007", "category": "Навигация", "question": "Как ориентироваться в здании — что где находится?", "answer": "Ключевые пространства: 1-й этаж — кинотеатр/Актовый зал, Ателье, Библиотека, Магазин, стойка информации и касса на Площади; –1-й этаж — Галереи (основные выставочные пространства), парковка, гардероб, пеленальная и Тихая комната; 2-й этаж — Галереи 2-го этажа, Платформы, Классы; правее — Резиденции. Подробная схема есть на странице «План здания» на сайте.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-008", "category": "Навигация", "question": "Как добраться на метро/автобусе?", "answer": "Пешком 10–15 минут от станций «Кропоткинская» (2-й выход, ~1 км), «Полянка» (~940 м), «Третьяковская» (~1,17 км). На автобусе — остановки «Метро Кропоткинская», «Болотная площадь», «Пречистенская набережная», «Театр Эстрады», «Большая Якиманка» (маршруты см. на сайте).", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-009", "category": "Гардероб", "question": "Есть ли гардероб и нужно ли сдавать одежду?", "answer": "Да, гардероб на –1-м этаже. Верхнюю одежду обязательно сдавать при посещении выставочных пространств, Актового зала и Библиотеки. Классы оборудованы собственными вешалками.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-010", "category": "Гардероб", "question": "Что делать с зонтом и крупными вещами?", "answer": "Зонты и предметы крупнее 30×40×20 см нужно сдать в гардероб или оставить в запирающихся ячейках у входа. ГЭС-2 не несёт ответственности за вещи, оставленные без присмотра.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-011", "category": "Гардероб", "question": "Можно ли зайти с велосипедом, самокатом, детской коляской?", "answer": "Взрослые велосипеды и самокаты — только на две уличные велопарковки (у служебного входа со стороны «Ударника» и у «Сводов»/Патриаршего моста), внутрь заносить нельзя. Детские самокаты, беговелы и велосипеды (колёса до 45 см) можно занести, но кататься внутри нельзя — оставить в ячейке или на парковке колясок. С детской коляской можно перемещаться почти по всей территории, кроме Актового зала; в отдельных выставочных пространствах возможны ограничения. Парковка для колясок — справа от входа, под лестницей к Библиотеке.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-012", "category": "Фото/видео", "question": "Можно ли фотографировать и снимать видео?", "answer": "Можно снимать только на телефон — без профессиональной техники, вспышек, штативов, стабилизаторов и микрофонов. Съёмка не должна мешать другим посетителям и не должна включать реквизит, сменную одежду и т.п. Любительская съёмка запрещена на киносеансах, спектаклях и других представлениях.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-013", "category": "Фото/видео", "question": "Можно ли провести профессиональную или коммерческую съёмку?", "answer": "Нет, кроме случаев, когда съёмка связана с программой ГЭС-2 и заранее согласована. Запрос на аккредитацию отправляется на press@v-a-c.org, ответ приходит не менее чем через 3 рабочих дня.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-014", "category": "Еда и напитки", "question": "Можно ли пройти с едой и напитками?", "answer": "Безалкогольные напитки в пластиковых бутылках до 1 литра или в стаканах с крышкой — можно. Сильно пахнущую еду проносить не стоит, а в выставочные пространства нельзя заходить с едой и напитками вообще. В Актовый зал можно взять безалкогольные напитки, кофе и чай в закрытых стаканах, но не еду.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-015", "category": "Доступность", "question": "Есть ли доступ для посетителей на коляске, тифлокомментирование, жестовый перевод?", "answer": "Да. На всех этажах — лифты с шрифтом Брайля и голосовыми объявлениями, доступные туалеты на –1-м и 3-м этажах, тактильные модели здания у стойки информации на 1-м этаже. Библиотека оборудована для незрячих и слабовидящих (JAWS, NVDA, дисплей Брайля). Большинство публичных мероприятий сопровождаются переводом на русский жестовый язык; переводчика на непереведённое событие можно заказать заранее на access@v-a-c.org. Контакты по доступности: access@ges-2.org, телефон/WhatsApp/Telegram +7 (963) 996 3687.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-016", "category": "Доступность", "question": "Что можно взять на стойке информации, если нужна дополнительная поддержка?", "answer": "Сенсорную сумку (шумоподавляющие наушники, сидушка, плед, беруши, антистресс-игрушка), складной стул, аудиогид с тифлокомментарием к текущей выставке, коляску (в гардеробе на –1-м этаже), миску для воды для собаки-поводыря.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-017", "category": "Доступность", "question": "Можно ли прийти с животным?", "answer": "Только с собакой-поводырём — на стойке информации можно попросить миску для воды. Другие животные на территорию не допускаются.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-018", "category": "Доступность", "question": "Можно ли получить сопровождение от метро или по зданию?", "answer": "Сопровождение по зданию — заявка на access@ges-2.org или по телефону +7 (495) 990 0000 / +7 (963) 996 3687, либо отметить при регистрации на мероприятие. Сопровождение от метро — через Центр обеспечения мобильности пассажиров Московского метрополитена: +7 (495) 622 7341 или +7 (800) 250 7341 (бесплатно), либо заявка на mosmetro.ru.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-019", "category": "Оплата", "question": "Как оплатить билет?", "answer": "Онлайн — на сайте ges-2.org (раздел «Календарь» или страница события) либо на странице билетной системы. Офлайн — в кассе на стойке информации на 1-м этаже, билеты на выставки продаются там до 21:00.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-020", "category": "Оплата", "question": "Как оплатить парковку?", "answer": "Банковской картой или наличными через терминалы на –1-м и –2-м уровнях; при въезде терминал выдаёт талон, который нужно сохранить до выезда. Стоимость — 500 руб./час, выехать нужно в течение 15 минут после оплаты.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-021", "category": "Оплата", "question": "Кому положена бесплатная парковка?", "answer": "Многодетным семьям и посетителям с инвалидностью — нужно подойти на стойку информации на 1-м этаже с удостоверением и парковочным талоном, сотрудник обнулит талон.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-022", "category": "Дети", "question": "Можно ли прийти с детьми?", "answer": "Да. Дети и подростки до 14 лет проходят только в сопровождении взрослого с оригиналом паспорта. Подростки старше 14 лет могут посещать самостоятельно по паспорту. Вход на выставки бесплатный для всех от 0 до 18 лет.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-023", "category": "Дети", "question": "Есть ли возрастные ограничения на отдельные события?", "answer": "Да, у некоторых событий стоит маркировка 18+ — на входе нужно подтвердить возраст документом; за детей на таких событиях отвечают сопровождающие их взрослые. Мастер-классы в «Сводах» доступны только людям старше 18 лет (тоже с документом). Точная возрастная маркировка конкретного события — на его странице в календаре.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-024", "category": "Курение / животные / торговля", "question": "Что прямо запрещено на территории?", "answer": "Курение и вейпы — на всей территории; торговля и любая предпринимательская деятельность; несогласованные мероприятия; проносить произведения искусства, оружие, крупногабаритный спортивный инвентарь, дроны и ряд других предметов — полный список в Правилах посещения.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-025", "category": "Билеты", "question": "Как купить билет?", "answer": "Уточнить дату, мероприятие и количество билетов, свериться с наличием мест по актуальному источнику (билетная система) — не отвечать по памяти. Можно купить онлайн на сайте/в билетной системе либо офлайн в кассе на стойке информации 1-го этажа.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-026", "category": "Билеты", "question": "Сколько стоит билет на выставку?", "answer": "Билет на одну выставку –1-го этажа — 600 руб., на одну выставку 2-го этажа — 400 руб., единый билет на все выставки (при одновременном показе от трёх выставок) — 1000 руб. и даёт право один раз вернуться на выставки до их закрытия.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-027", "category": "Билеты", "question": "Кому положены льготы на билеты?", "answer": "Бесплатно: посетители 0–18 лет, волонтёры, посетители с инвалидностью I и II группы и один сопровождающий (для детей с инвалидностью — тоже). Скидка 50%: студенты очной формы, пенсионеры, посетители с инвалидностью III группы. Полный список льготных категорий и нужных документов — в отдельном файле на сайте.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-028", "category": "Билеты", "question": "Есть ли бесплатные дни?", "answer": "Каждая первая среда месяца — все выставки Дома культуры бесплатны. Программы «ГЭС-2: Проспект» и выставки Центра художественного производства «Своды» бесплатны всегда.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-029", "category": "Билеты", "question": "Можно ли вернуть билет?", "answer": "Да, если соблюдены сроки и условия. Полный возврат — при отмене, переносе или замене события по инициативе ГЭС-2, техническом сбое или закрытии площадки. При уважительной причине (болезнь, смерть близкого) — по документам, поданным за 3–10 дней до события. Для обычных билетов заявление обычно нужно подать не позднее чем за 1–3 дня до события (срок указан в правилах конкретного билета); после — решение на усмотрение ГЭС-2. Не возвращаются: использованные билеты, билеты по акциям/льготам без доп. условий и билеты, явно оформленные как невозвратные.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-030", "category": "Билеты", "question": "Как подать заявление на возврат и сколько это займёт?", "answer": "Через сайт, по email, указанному при покупке, или лично в кассе — с билетом/реквизитами, чеком и подтверждающими документами. Рассмотрение — до 5 рабочих дней, зачисление денег — до 30 дней тем же способом, которым оплачивался билет. По билетам на выставки также можно обратиться напрямую в поддержку билетной системы: +7 (495) 120 4264 или support@zapomni.ru.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-031", "category": "Билеты", "question": "Можно ли перенести билет на другую дату по собственной инициативе?", "answer": "", "status": "pending", "source": null, "notes": "[уточнить: сайт описывает только возврат, а не прямой обмен билета на другую дату по желанию посетителя — механику обмена нужно уточнить у билетной службы]", "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": null}, {"id": "GES2-032", "category": "Билеты", "question": "Я опаздываю — успею на мероприятие?", "answer": "Билет на событие даёт право входа за час до начала. На концерты и другие представления просят приходить вовремя — при опоздании компания может не пропустить. Исключение — киносеансы: там свободная рассадка, и при опоздании можно тихо занять любое свободное место, не потревожив других зрителей.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-033", "category": "Билеты", "question": "Мероприятие отменили или перенесли — что мне делать?", "answer": "Сообщить факт изменения прямо. При отмене, переносе или замене события по инициативе ГЭС-2 полагается полный возврат стоимости билета — оформляется по общей процедуре возврата (см. выше).", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-034", "category": "Билеты", "question": "Можно ли купить билет на месте, без предварительной покупки?", "answer": "Да, в кассе на стойке информации на 1-м этаже — если на событие ещё есть места; билеты на выставки продаются там до 21:00.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-035", "category": "Медиаторский тур", "question": "Что такое медиаторский тур и сколько он стоит?", "answer": "Это посещение выставки, здания или территории вокруг ГЭС-2 с обсуждением увиденного вместе с медиатором. Если тур по выставке — сама медиация бесплатна, но нужен билет на выставку. Индивидуальный тур для организованной группы включает билет на выставку в стоимость — вопросы по нему на hospitality@v-a-c.org.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-036", "category": "Медиаторский тур", "question": "Нужна ли регистрация, сколько длится и сколько человек в группе?", "answer": "Регистрация обязательна. Тур длится 1–2 часа, группа — 10–15 человек. Туры проходят каждый день, доступны на русском и английском (английский — по предварительному запросу).", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-037", "category": "Медиаторский тур", "question": "Где и во сколько сбор конкретного тура?", "answer": "Точка и время сбора у каждого тура свои — уточняются на странице конкретного тура в календаре, единого правила нет.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-038", "category": "Медиаторский тур", "question": "Я опаздываю к началу тура — что делать?", "answer": "", "status": "pending", "source": null, "notes": "[уточнить: сайт не описывает отдельно эту ситуацию — уточнить у команды медиации, возможно ли присоединиться позже]", "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": null}, {"id": "GES2-039", "category": "Концерт", "question": "Где проходят концерты и нужно ли приходить вовремя?", "answer": "Чаще всего в Актовом зале (290 мест, трансформируемая сцена), также на Платформах, в Насосной, в Роще или на Ступенях (в тёплую погоду). На концерты просят приходить вовремя — при опоздании вход может быть невозможен.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-040", "category": "Концерт", "question": "Можно ли с коляской и напитками на концерт в Актовом зале?", "answer": "Коляску нужно оставить на парковке колясок у входа — в Актовый зал с коляской нельзя. Безалкогольные напитки в бутылке до 1 л или кофе/чай в стакане с крышкой — можно, еду — нельзя.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-041", "category": "Концерт", "question": "Можно ли снимать концерт на телефон?", "answer": "Как и на других представлениях — только на телефон, без вспышек, штативов и профессиональной техники; во время представления любительская видеосъёмка отдельных номеров может быть ограничена — уточнять по конкретному событию.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-042", "category": "Концерт", "question": "Сколько длится концерт, есть ли антракт, есть ли возрастные ограничения?", "answer": "", "status": "pending", "source": null, "notes": "[уточнить по конкретному событию в календаре — общего правила для всех концертов нет; маркировка возраста (0+…18+) указана на странице события]", "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": null}, {"id": "GES2-043", "category": "Танцевальный показ", "question": "Это можно только смотреть или нужно участвовать?", "answer": "Уточнить у посетителя формат по конкретному событию: часть программы — это показы (смотреть), часть — танцевальные занятия с участием. Требования к одежде и физической подготовке для занятий указаны на странице события.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-044", "category": "Танцевальный показ", "question": "Сколько длится, нужна ли предварительная запись?", "answer": "", "status": "pending", "source": null, "notes": "[уточнить по конкретному событию — общего правила нет; для занятий обычно требуется регистрация, для показов — билет/регистрация на вход]", "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": null}, {"id": "GES2-045", "category": "Выставка", "question": "Где расположены выставки и сколько стоит билет?", "answer": "В основном на –1-м этаже (Галереи) и на 2-м этаже (Галереи 2-го этажа). Билет на одну выставку — 600 (–1-й этаж) или 400 руб. (2-й этаж), единый билет на все — 1000 руб., подробности льгот см. в разделе «Билеты» выше.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-046", "category": "Выставка", "question": "Можно ли прийти на выставку повторно по одному билету?", "answer": "Только по единому билету на все выставки — он даёт право один раз вернуться до их закрытия. Билет на одну выставку такого права не даёт.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-047", "category": "Выставка", "question": "Есть ли ограничения на фото/видео на конкретной выставке?", "answer": "Общее правило — только телефон, без вспышек и штативов; отдельные ограничения по конкретной экспозиции указываются на странице события.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-048", "category": "Выставка", "question": "Сколько времени в среднем занимает осмотр?", "answer": "", "status": "pending", "source": null, "notes": "[уточнить — общего норматива на сайте нет, зависит от конкретной выставки; можно ориентироваться по площади экспозиции и отзывам, но не обещать точное время]", "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": null}, {"id": "GES2-049", "category": "Кинопоказ", "question": "Какая рассадка в кинотеатре и что если я опоздал?", "answer": "Рассадка свободная, зал на 290 мест. Если посетитель опаздывает к началу сеанса — можно тихо занять любое свободное место, не потревожив других зрителей.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-050", "category": "Кинопоказ", "question": "На каком языке идут фильмы, есть ли тифлокомментарий?", "answer": "Большинство фильмов — на языке оригинала с субтитрами; отдельные показы сопровождаются тифлокомментарием — это указано на странице конкретного показа.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-051", "category": "Кинопоказ", "question": "Можно ли снимать во время показа?", "answer": "Нет, любительская фото- и видеосъёмка на киносеансах запрещена.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-052", "category": "Кинопоказ", "question": "Какая возрастная маркировка у фильма и будет ли обсуждение после?", "answer": "", "status": "pending", "source": null, "notes": "[уточнить по конкретному сеансу в календаре — маркировка (0+…18+) и формат «кинопоказ и обсуждение» видны на странице события]", "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": null}, {"id": "GES2-053", "category": "Лекция", "question": "Нужна ли регистрация на лекцию/встречу/презентацию?", "answer": "Как правило, да — регистрация или билет оформляются на странице конкретного события в календаре; общего единого правила для всех форматов публичной программы нет.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-054", "category": "Лекция", "question": "Будет ли перевод на жестовый язык?", "answer": "Большинство публичных мероприятий сопровождаются переводом на русский жестовый язык; если для конкретного события перевод не заявлен, его можно заказать заранее на access@v-a-c.org.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-055", "category": "Лекция", "question": "Будет ли запись/трансляция, если я не попаду?", "answer": "", "status": "pending", "source": null, "notes": "[уточнить по конкретному событию — общей политики записи всех лекций на сайте не найдено]", "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": null}, {"id": "GES2-056", "category": "Прочее", "question": "Что такое Ателье и для кого оно?", "answer": "Открытая мастерская для детей от 3 лет и взрослых с пятью зонами (бумага, дерево, глина, ткань, свободная комбинация материалов). Часы работы — по расписанию на сайте, контакт — atelier@v-a-c.org.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-057", "category": "Прочее", "question": "Кого пускают на мастер-классы в «Своды»?", "answer": "Только людей старше 18 лет — нужно взять с собой документ, подтверждающий возраст. Мастерские «Сводов» доступны для наблюдения через прозрачные стены, а поработать на профессиональном оборудовании можно, посетив мастер-класс.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-058", "category": "Прочее", "question": "Это разовое посещение или цикл встреч?", "answer": "Если формат — кружок или серия мастер-классов, на странице события обычно указано, как записаться сразу на весь цикл; для разовых занятий/игр действует обычная регистрация на конкретную дату.", "status": "answered", "source": "ges-2.org", "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": "2026-08-09"}, {"id": "GES2-059", "category": "Билеты", "question": "Можно ли перенести билет на другую дату по собственной инициативе (не через процедуру возврата)?", "answer": "", "status": "pending", "source": null, "notes": null, "channels": ["вход/ресепшн", "инфостойка", "сотрудники в пространстве", "телефон", "email"], "last_updated": null}, {"id": "GES2-060", "category": "Билеты", "question": "Что делать, если я потерял электронный или бумажный билет/подтверждение регистрации?", "answer": "", "status": "pending", "source": null, "notes": null, "channels": ["вход/ <script>
(function () {
  'use strict';

  var KB = JSON.parse(document.getElementById('kb-data').textContent);
  var entries = KB.entries;

  var state = { q: '', category: 'all' };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function highlight(text, q) {
    var escaped = escapeHtml(text);
    if (!q) return escaped;
    var escapedQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var re = new RegExp('(' + escapedQ + ')', 'ig');
    return escaped.replace(re, '<mark>$1</mark>');
  }

  function matchesSearch(entry, q) {
    if (!q) return true;
    var haystack = (entry.question + ' ' + entry.answer + ' ' + entry.category + ' ' + (entry.notes || '')).toLowerCase();
    return haystack.indexOf(q) !== -1;
  }

  function buildCategoryChips() {
    var counts = {};
    entries.forEach(function (e) { counts[e.category] = (counts[e.category] || 0) + 1; });
    var cats = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });

    var el = document.getElementById('cat-filter');
    var html = '<button type="button" class="chip active" data-cat="all">Все категории <span class="n">' + entries.length + '</span></button>';
    cats.forEach(function (c) {
      html += '<button type="button" class="chip" data-cat="' + escapeHtml(c) + '">' + escapeHtml(c) + ' <span class="n">' + counts[c] + '</span></button>';
    });
    el.innerHTML = html;
    el.addEventListener('click', function (e) {
      var btn = e.target.closest('.chip');
      if (!btn) return;
      state.category = btn.getAttribute('data-cat');
      el.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('active', c === btn); });
      render();
    });
  }

  function legacyCopy(text) {
    // Фолбэк для браузеров/контекстов без Clipboard API (например, если
    // страница открыта не по https и не с localhost).
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copyAnswer(text, btn) {
    var original = btn.textContent;
    function showResult(ok) {
      btn.textContent = ok ? 'Скопировано' : 'Не скопировалось — выделите вручную';
      btn.classList.toggle('copied', ok);
      setTimeout(function () { btn.textContent = original; btn.classList.remove('copied'); }, 1600);
    }

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { showResult(true); },
        function () { showResult(legacyCopy(text)); });
    } else {
      showResult(legacyCopy(text));
    }
  }

  function cardHtml(entry, q) {
    var isPending = entry.status === 'pending';
    var head = '<div class="entry-head"><span class="entry-category">' + escapeHtml(entry.category) +
      '</span><span class="entry-id">' + escapeHtml(entry.id) + '</span></div>';
    var question = '<h3 class="entry-question">' + highlight(entry.question, q) + '</h3>';

    var body, footer;
    if (isPending) {
      var notes = entry.notes ? highlight(entry.notes, q) : 'информация уточняется у профильной команды.';
      body = '<span class="entry-pending-tag">Требует уточнения</span>' +
        '<div class="entry-notes">' + notes + '</div>';
      footer = '<div class="entry-footer"><span class="entry-source-line">без готового ответа — не зачитывать посетителю как факт</span></div>';
    } else {
      body = '<div class="entry-answer">' + highlight(entry.answer, q) + '</div>';
      footer = '<div class="entry-footer">' +
        '<span class="entry-source-line">' + escapeHtml(entry.source || '') + (entry.last_updated ? ' · обновлено ' + escapeHtml(entry.last_updated) : '') + '</span>' +
        '<button type="button" class="copy-btn" data-answer="' + escapeHtml(entry.answer) + '">Скопировать ответ</button>' +
        '</div>';
    }

    return '<article class="entry" data-status="' + entry.status + '">' + head + question + body + footer + '</article>';
  }

  function render() {
    var q = state.q.trim().toLowerCase();
    var filtered = entries.filter(function (e) {
      if (state.category !== 'all' && e.category !== state.category) return false;
      return matchesSearch(e, q);
    });

    var resultsEl = document.getElementById('results');
    document.getElementById('result-count').textContent = filtered.length + ' из ' + entries.length;

    if (filtered.length === 0) {
      resultsEl.innerHTML = '<div class="empty-state">Ничего не найдено по этому запросу и фильтрам.<br><button type="button" id="reset-btn">Сбросить всё</button></div>';
      document.getElementById('reset-btn').addEventListener('click', resetAll);
      return;
    }

    resultsEl.innerHTML = filtered.map(function (e) { return cardHtml(e, q); }).join('');
    resultsEl.querySelectorAll('.copy-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { copyAnswer(btn.getAttribute('data-answer'), btn); });
    });
  }

  function resetAll() {
    state = { q: '', category: 'all' };
    document.getElementById('search').value = '';
    document.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('active', c.getAttribute('data-cat') === 'all'); });
    render();
  }

  document.getElementById('search').addEventListener('input', function (e) {
    state.q = e.target.value;
    render();
  });

  document.addEventListener('keydown', function (e) {
    var active = document.activeElement;
    var typing = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
    if (e.key === '/' && !typing) {
      e.preventDefault();
      document.getElementById('search').focus();
    } else if (e.key === 'Escape' && active === document.getElementById('search')) {
      document.getElementById('search').value = '';
      state.q = '';
      render();
    }
  });

  // Статистика в шапке
  var answeredCount = entries.filter(function (e) { return e.status === 'answered'; }).length;
  var pendingCount = entries.length - answeredCount;
  document.getElementById('stats').innerHTML =
    '<span>обновлено ' + escapeHtml(KB.meta.generated) + '</span>' +
    '<span>' + answeredCount + ' отвечено</span>' +
    '<span>' + pendingCount + ' уточняется</span>';

  buildCategoryChips();
  render();
  document.getElementById('search').focus();
})();
</script>
